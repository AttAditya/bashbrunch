name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    if: github.event_name != 'workflow_dispatch' || github.repository_owner == github.actor
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run release script
        run: |
          chmod +x ci/release.sh
          bash ci/release.sh

